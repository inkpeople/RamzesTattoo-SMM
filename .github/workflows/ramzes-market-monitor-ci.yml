name: RAMZES market monitor checks

on:
  push:
    branches: [ramzes-free-market-monitor]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile ramzes-content-engine/market_monitor_worker.py
      - name: Unit tests
        working-directory: ramzes-content-engine
        run: python -m unittest discover -s tests -v
