name: RAMZES AI checks

on:
  push:
    paths:
      - "ramzes-content-engine/**"
      - ".github/workflows/ramzes-ai-ci.yml"
  pull_request:
    paths:
      - "ramzes-content-engine/**"
      - ".github/workflows/ramzes-ai-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ramzes-content-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ramzes-content-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run security tests
        run: python -m unittest discover -s tests -v
