<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b10"><title>Ramzes Tattoo — SMM Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#f4f4f5;font-family:Inter,system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:21px;font-weight:800}.sub{color:#9ca3af;font-size:12px;margin-top:3px}.dot{width:10px;height:10px;border-radius:50%;background:#a3e635;box-shadow:0 0 14px #a3e635}.card{background:#121219;border:1px solid #24242d;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.net{padding:13px 8px;border-radius:14px;background:#191922;text-align:center}.net b{display:block;font-size:14px}.net span{font-size:11px;color:#a1a1aa}.label{font-size:12px;color:#a1a1aa;margin-bottom:7px}textarea,input{width:100%;background:#0d0d13;color:#fff;border:1px solid #30303a;border-radius:12px;padding:12px;outline:0}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.btn{padding:12px 15px;border-radius:12px;background:#24242d;color:#fff;font-weight:700}.primary{background:#a3e635;color:#101014}.purple{background:#8b5cf6}.muted{color:#a1a1aa}.post{border:1px solid #2b2b35;border-radius:14px;padding:13px;margin-top:10px}.post h3{margin:0 0 8px;font-size:15px}.status{font-size:11px;color:#a3e635}.variant{background:#0d0d13;border-radius:12px;padding:11px;margin-top:8px;white-space:pre-wrap;font-size:13px;line-height:1.45}.actions{display:flex;gap:7px;margin-top:9px}.actions .btn{flex:1}.log{font-size:12px;white-space:pre-wrap;color:#b8b8c2;max-height:180px;overflow:auto}.small{font-size:11px;color:#71717a}.settings input{margin-bottom:8px}
 .media-box{width:100%;margin-top:7px}.media-btn{display:flex;width:100%;min-height:50px;align-items:center;justify-content:center;padding:12px 15px;border-radius:12px;background:#24242d;color:#fff;font-weight:700;box-sizing:border-box;cursor:pointer}.media-input{position:absolute;width:1px;height:1px;opacity:0}.media-preview{display:none;margin-top:9px;background:#0d0d13;border:1px solid #30303a;border-radius:12px;padding:10px;box-sizing:border-box;overflow:hidden}.media-preview img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:9px}.media-preview div{margin-top:7px;font-size:11px;color:#a1a1aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-remove{display:block;width:100%;margin-top:8px;padding:10px 12px;border-radius:10px;background:#24242d;color:#fff;box-sizing:border-box}.post{min-width:0;overflow:hidden}.actions{min-width:0;width:100%;flex-wrap:wrap}.actions .btn{min-width:0;max-width:100%;box-sizing:border-box}.delete-draft{display:block;width:100%;max-width:100%;box-sizing:border-box;margin-top:9px} .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;width:100%;min-width:0}.actions .btn{flex:1 1 0;min-width:0;width:auto;max-width:100%;min-height:38px;padding:8px 9px;border-radius:10px;box-sizing:border-box;border:1px solid #34343f;background:linear-gradient(180deg,#272731,#1c1c24);box-shadow:inset 0 1px 0 #ffffff0b,0 3px 9px #0004;font-size:12px;line-height:1.15;white-space:normal}.actions .btn.primary{background:linear-gradient(180deg,#b7f45b,#9bdc32);color:#111;border-color:#b7f45b;box-shadow:0 4px 12px #a3e6352e}.actions .btn.purple{background:linear-gradient(180deg,#9b6cff,#7547df);color:#fff;border-color:#9b6cff;box-shadow:0 4px 12px #8b5cf62e}.delete-draft{display:block!important;width:100%!important;max-width:100%!important;min-height:36px!important;margin-top:7px!important;padding:7px 9px!important;border-radius:10px!important;background:linear-gradient(180deg,#2a2024,#20181c)!important;border:1px solid #69414a!important;color:#ffb1bb!important;font-size:12px!important;box-sizing:border-box!important;white-space:normal!important}.post .actions .btn{max-width:100%}</style><style> .media-box{width:100%;margin-top:4px}.media-btn{width:100%;min-height:52px;padding:14px;border:1px solid #30303a;border-radius:14px;background:#191922;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;box-sizing:border-box}.media-btn:active{transform:scale(.99)}.media-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none}.media-preview{display:none;width:100%;margin-top:10px;padding:10px;border:1px solid #30303a;border-radius:14px;background:#0d0d13;box-sizing:border-box;overflow:hidden}.media-preview img{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:10px}.media-preview div{margin-top:8px;color:#a1a1aa;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-remove{width:100%;margin-top:9px;min-height:42px;border:1px solid #55343a;border-radius:11px;background:#171218;color:#ff9da8;box-sizing:border-box}.post{overflow:hidden}.post .actions{width:100%;box-sizing:border-box}.post .actions .btn{width:100%;max-width:100%;box-sizing:border-box;margin-left:0;margin-right:0}.post>[data-delete-post],.post .delete-draft{width:100%!important;max-width:100%!important;box-sizing:border-box!important;margin-left:0!important;margin-right:0!important;display:block!important}</style></head>
<body><main class="wrap">
<header class="head"><div><div class="brand">Ramzes Tattoo · SMM Agent</div><div class="sub">Telegram · VK · Instagram</div></div><div class="dot"></div></header>
<section class="card"><div class="grid"><div class="net"><b>Telegram</b><span>готов</span></div><div class="net"><b>VK</b><span>подключение</span></div><div class="net"><b>Instagram</b><span>Metricool</span></div></div></section>
<section class="card"><div class="label">Тема публикации</div><textarea id="topic" placeholder="Например: свободная дата на татуировку на этой неделе"></textarea><div class="label" style="margin-top:12px">Изображение к посту</div><div class="media-box"><label for="media" class="media-btn">📷 Добавить изображение</label><input id="media" type="file" accept="image/jpeg,image/png,image/webp" class="media-input"><div id="mediaPreview" class="media-preview"><img id="mediaThumb" alt=""><div id="mediaName"></div><button type="button" id="mediaRemove" class="media-remove">Удалить изображение</button></div></div><div class="row"><button class="btn primary" onclick="createDraft()">Создать черновик</button><button class="btn" onclick="loadReview()">Обновить</button></div></section>
<section class="card"><h3 style="margin:0">На согласовании</h3><div id="posts"><div class="muted" style="margin-top:10px">Нажми «Обновить»</div></div><div id="scheduled"></div></section>
<section class="card settings"><details><summary>⚙️ Подключение панели</summary><p class="small">Supabase подключается автоматически. Ключ вручную вводить не нужно.</p></details></section>
<section class="card"><div class="label">Лог</div><div id="log" class="log">Готов.</div></section>
</main>
<script>
const BRAND="114e1c88-4850-41df-b192-1aa00b1782f1";
const SUPABASE_URL="https://jgzzdsittnzomedvsspj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_z40zmd4oAy9jUr3Q4BgDYQ_-IpiIlJe";
let accessToken="";
function log(x){const el=document.getElementById("log");if(el)el.textContent=new Date().toLocaleTimeString()+" — "+x}
async function getAccessToken(){
  if(accessToken)return accessToken;
  const saved=localStorage.getItem("ramzes_smm_access_token");
  if(saved){accessToken=saved;return accessToken}
  const r=await fetch(SUPABASE_URL+"/auth/v1/signup",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({})});
  const d=await r.json();
  if(!r.ok||!d.access_token)throw new Error(d.msg||d.error_description||"Не удалось войти в панель. Включи Anonymous Sign-Ins в Supabase.");
  accessToken=d.access_token;
  localStorage.setItem("ramzes_smm_access_token",accessToken);
  return accessToken
}
async function api(command,extra={}){
  const token=await getAccessToken();
  const r=await fetch(SUPABASE_URL+"/functions/v1/smm-agent",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify({command,brand_id:BRAND,...extra})});
  let d={};try{d=await r.json()}catch(_){}
  if(!r.ok||d.error)throw new Error(d.error||d.message||("Ошибка API "+r.status));
  return d
}
async function createDraft(){try{const topic=document.getElementById("topic").value.trim();if(!topic)return log("Введите тему публикации.");const file=document.getElementById("media")?.files?.[0];const d=await api("create_draft",{topic});const tg=(d.variants||[]).find(v=>v.network==="telegram");if(!tg)throw new Error("Telegram-вариант не найден");if(file){log("Загружаю изображение через серверный загрузчик...");const token=await getAccessToken();const fd=new FormData();fd.append("brand_id",BRAND);fd.append("post_id",d.post.id);fd.append("variant_id",tg.id);fd.append("file",file,file.name);const up=await fetch(SUPABASE_URL+"/functions/v1/upload-media",{method:"POST",headers:{"Authorization":"Bearer "+token,"apikey":SUPABASE_PUBLISHABLE_KEY},body:fd});let ud={};try{ud=await up.json()}catch(_){}if(!up.ok||ud.error)throw new Error("Ошибка загрузки изображения: "+(ud.error||("HTTP "+up.status)));log("Изображение прикреплено.")}else log("Черновик создан: "+d.post.id);document.getElementById("topic").value="";if(document.getElementById("media"))document.getElementById("media").value="";const p=document.getElementById("mediaPreview");if(p)p.style.display="none";await loadReview()}catch(e){log(e.message)}}
async function loadReview(){try{const d=await api("list_review");render(d.posts||[]);log("Загружено: "+(d.posts||[]).length)}catch(e){log(e.message)}}
async function approve(postId){
  try{
    const d=await api("list_review");
    const p=(d.posts||[]).find(x=>x.id===postId);
    const tg=(p?.smm_post_variants||[]).find(v=>v.network==="telegram");
    if(!tg)throw new Error("Telegram-вариант не найден");
    await api("publish_telegram",{variant_id:tg.id});
    log("Пост опубликован в Telegram.");
    await loadReview();
  }catch(e){log(e.message)}
}
async function publish(id){try{await api("publish_telegram",{variant_id:id});log("Опубликовано в Telegram.");await loadReview()}catch(e){log(e.message)}}
function render(posts){renderScheduled(posts);const el=document.getElementById("posts");if(!posts.length){el.innerHTML='<div class="muted" style="margin-top:10px">Пока нет черновиков.</div>';return}el.innerHTML=posts.map(p=>{const tg=(p.smm_post_variants||[]).find(v=>v.network==="telegram");return '<div class="post"><h3>'+esc(p.topic)+'</h3><div class="status">'+esc(p.status)+'</div><div class="variant">'+esc(tg?.text||"Telegram-вариант пока отсутствует")+'</div><div class="actions">'+(p.status==="review"?'<button class="btn purple" onclick="approve(\''+p.id+'\')">✓ Одобрить и опубликовать</button><button class="btn" onclick="schedule(\''+p.id+'\')">🕒 Отложить</button>':"")+(p.status==="approved"&&tg?'<button class="btn primary" onclick="publish(\''+tg.id+'\')">🚀 Опубликовать в Telegram</button>':"")+(["draft","review"].includes(p.status)?'<button type="button" class="btn delete-draft" onclick="deletePost(\''+p.id+'\')">🗑 Убрать из черновика</button>':"")+'</div></div>'}).join("")}
async function deletePost(postId){if(!confirm("Убрать эту публикацию из черновиков?"))return;try{await api("delete_post",{post_id:postId});log("Публикация удалена.");await loadReview()}catch(e){log(e.message)}}
function schedule(postId){const modal=document.createElement("div");modal.style.cssText="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit";modal.innerHTML='<div style="width:min(400px,100%);background:#17171c;border:1px solid #383842;border-radius:20px;padding:20px;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><b style="font-size:18px">🕒 Отложенная публикация</b><button id="scClose" style="background:#292930;color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:24px">×</button></div><label style="display:block;color:#aaa;font-size:13px;margin-bottom:7px">Дата</label><input id="scDate" type="date" style="width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1px solid #3b3b45;background:#22222a;color:#fff;padding:0 12px;font-size:16px"><label style="display:block;color:#aaa;font-size:13px;margin:16px 0 7px">Время</label><input id="scTime" type="time" style="width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1px solid #3b3b45;background:#22222a;color:#fff;padding:0 12px;font-size:18px"><div id="scPreview" style="text-align:center;background:#22222a;border-radius:12px;padding:12px;margin:16px 0;color:#ddd"></div><button id="scSave" class="btn primary" style="width:100%;min-height:50px">✓ Запланировать</button></div>';document.body.appendChild(modal);const date=modal.querySelector("#scDate"),time=modal.querySelector("#scTime"),preview=modal.querySelector("#scPreview"),min=new Date(Date.now()+5*60000),pad=n=>String(n).padStart(2,"0");date.min=min.toISOString().slice(0,10);date.value=date.min;time.value=pad(min.getHours())+":"+pad(Math.min(59,Math.ceil(min.getMinutes()/5)*5));function upd(){const d=date.value.split("-");const t=time.value.split(":");if(d.length===3&&t.length===2){const dt=new Date(+d[0],+d[1]-1,+d[2],+t[0],+t[1]);preview.textContent=dt.toLocaleString("ru-RU",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})}}date.onchange=upd;time.onchange=upd;upd();modal.querySelector("#scClose").onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.querySelector("#scSave").onclick=()=>{const d=date.value.split("-"),t=time.value.split(":");const dt=new Date(+d[0],+d[1]-1,+d[2],+t[0],+t[1]);if(isNaN(dt)||dt<=new Date(Date.now()+5*60000))return log("Выбери будущее время минимум через 5 минут.");api("schedule_post",{post_id:postId,publish_at:dt.toISOString()}).then(()=>{
  modal.remove();
  log("Публикация запланирована на "+dt.toLocaleString("ru-RU"));
  loadReview()
}).catch(e=>log("Ошибка планирования: "+e.message))}}
function renderScheduled(posts){const el=document.getElementById("scheduled");const q=(posts||[]).filter(p=>p.status==="scheduled").sort((a,b)=>new Date(a.publish_at)-new Date(b.publish_at));if(!q.length){el.innerHTML="";return}el.innerHTML='<div style="margin-top:14px"><h3 style="margin:0 0 8px">🕒 Запланировано на сервере</h3>'+q.map(x=>'<div class="post"><div>'+esc(x.topic)+'</div><div class="small">Публикация: <b>'+new Date(x.publish_at).toLocaleString("ru-RU")+'</b></div></div>').join("")+'</div>'}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
document.addEventListener("DOMContentLoaded",()=>{const media=document.getElementById("media"),preview=document.getElementById("mediaPreview"),thumb=document.getElementById("mediaThumb"),name=document.getElementById("mediaName"),remove=document.getElementById("mediaRemove");if(media){media.addEventListener("change",()=>{const f=media.files&&media.files[0];if(!f)return;name.textContent="📷 "+f.name;thumb.src=URL.createObjectURL(f);preview.style.display="block"});}if(remove){remove.addEventListener("click",()=>{media.value="";preview.style.display="none";thumb.removeAttribute("src");name.textContent=""})}loadReview();});</script></body></html>
