<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b10"><title>Ramzes Tattoo — SMM Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#f4f4f5;font-family:Inter,system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:21px;font-weight:800}.sub{color:#9ca3af;font-size:12px;margin-top:3px}.dot{width:10px;height:10px;border-radius:50%;background:#a3e635;box-shadow:0 0 14px #a3e635}.card{background:#121219;border:1px solid #24242d;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.net{padding:13px 8px;border-radius:14px;background:#191922;text-align:center}.net b{display:block;font-size:14px}.net span{font-size:11px;color:#a1a1aa}.label{font-size:12px;color:#a1a1aa;margin-bottom:7px}textarea,input{width:100%;background:#0d0d13;color:#fff;border:1px solid #30303a;border-radius:12px;padding:12px;outline:0}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.btn{padding:12px 15px;border-radius:12px;background:#24242d;color:#fff;font-weight:700}.primary{background:#a3e635;color:#101014}.purple{background:#8b5cf6}.muted{color:#a1a1aa}.post{border:1px solid #2b2b35;border-radius:14px;padding:13px;margin-top:10px}.post h3{margin:0 0 8px;font-size:15px}.status{font-size:11px;color:#a3e635}.variant{background:#0d0d13;border-radius:12px;padding:11px;margin-top:8px;white-space:pre-wrap;font-size:13px;line-height:1.45}.actions{display:flex;gap:7px;margin-top:9px}.actions .btn{flex:1}.log{font-size:12px;white-space:pre-wrap;color:#b8b8c2;max-height:180px;overflow:auto}.small{font-size:11px;color:#71717a}.settings input{margin-bottom:8px}
.media-box{width:100%;margin-top:4px}.media-btn{width:100%;min-height:52px;padding:14px;border:1px solid #30303a;border-radius:14px;background:#191922;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}.media-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none}.media-preview{display:none;width:100%;margin-top:10px;padding:10px;border:1px solid #30303a;border-radius:14px;background:#0d0d13;box-sizing:border-box;overflow:hidden}.media-preview img{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:10px}.media-preview div{margin-top:8px;color:#a1a1aa;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-remove{width:100%;margin-top:9px;min-height:42px;border:1px solid #55343a;border-radius:11px;background:#171218;color:#ff9da8;box-sizing:border-box}.post{overflow:hidden}.post .actions{width:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:6px}.post .actions .btn{width:100%;max-width:100%;box-sizing:border-box;min-height:38px;padding:8px 9px;border-radius:10px}.post>[data-delete-post],.post .delete-draft{width:100%!important;max-width:100%!important;box-sizing:border-box!important;margin-top:7px!important;display:block!important}
</style></head>
<body><main class="wrap">
<header class="head"><div><div class="brand">Ramzes Tattoo · SMM Agent</div><div class="sub">Telegram · VK · Instagram</div></div><div class="dot"></div></header>
<section class="card"><div class="grid"><div class="net"><b>Telegram</b><span>готов</span></div><div class="net"><b>VK</b><span>подключение</span></div><div class="net"><b>Instagram</b><span>Metricool</span></div></div></section>
<section class="card"><div class="label">Тема публикации</div><textarea id="topic" placeholder="Например: свободная дата на татуировку на этой неделе"></textarea><div class="label" style="margin-top:12px">Изображение к посту</div><div class="media-box"><label for="media" class="media-btn">📷 Добавить изображение</label><input id="media" type="file" accept="image/jpeg,image/png,image/webp" class="media-input"><div id="mediaPreview" class="media-preview"><img id="mediaThumb" alt=""><div id="mediaName"></div><button type="button" id="mediaRemove" class="media-remove">Удалить изображение</button></div></div><div class="row"><button class="btn primary" onclick="createDraft()">Создать черновик</button><button class="btn" onclick="loadReview()">Обновить</button></div></section>
<section class="card"><h3 style="margin:0">На согласовании</h3><div id="posts"><div class="muted" style="margin-top:10px">Нажми «Обновить»</div></div><div id="scheduled"></div></section>
<section class="card settings"><details><summary>⚙️ Подключение панели</summary><p class="small">Supabase подключается автоматически.</p></details></section>
<section class="card"><div class="label">Лог</div><div id="log" class="log">Готов.</div></section>
</main>
<script>
const BRAND="114e1c88-4850-41df-b192-1aa00b1782f1";
const SUPABASE_URL="https://jgzzdsittnzomedvsspj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_z40zmd4oAy9jUr3Q4BgDYQ_-IpiIlJe";

function log(x){const el=document.getElementById("log");if(el)el.textContent=new Date().toLocaleTimeString()+" — "+x}

async function api(command,extra={}){
  const r=await fetch(SUPABASE_URL+"/functions/v1/smm-agent",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_PUBLISHABLE_KEY
    },
    body:JSON.stringify({command,brand_id:BRAND,...extra})
  });
  let d={};try{d=await r.json()}catch(_){}
  if(!r.ok||d.error)throw new Error(d.error||d.message||("Ошибка API "+r.status));
  return d;
}

async function uploadMedia(postId,variantId,file){
  const fd=new FormData();
  fd.append("brand_id",BRAND);
  fd.append("post_id",postId);
  fd.append("variant_id",variantId);
  fd.append("file",file,file.name);
  const r=await fetch(SUPABASE_URL+"/functions/v1/upload-media",{
    method:"POST",
    headers:{"apikey":SUPABASE_PUBLISHABLE_KEY},
    body:fd
  });
  let d={};try{d=await r.json()}catch(_){}
  if(!r.ok||d.error)throw new Error("Ошибка загрузки изображения: "+(d.error||("HTTP "+r.status)));
  return d;
}

async function createDraft(){
  try{
    const topic=document.getElementById("topic").value.trim();
    if(!topic)return log("Введите тему публикации.");
    const file=document.getElementById("media")?.files?.[0];
    const d=await api("create_draft",{topic});
    const tg=(d.variants||[]).find(v=>v.network==="telegram");
    if(!tg)throw new Error("Telegram-вариант не найден");
    if(file){
      log("Загружаю изображение...");
      await uploadMedia(d.post.id,tg.id,file);
      log("Черновик создан и изображение прикреплено.");
    }else{
      log("Черновик создан: "+d.post.id);
    }
    document.getElementById("topic").value="";
    const media=document.getElementById("media");
    if(media)media.value="";
    const p=document.getElementById("mediaPreview");
    if(p)p.style.display="none";
    await loadReview();
  }catch(e){log(e.message)}
}

async function loadReview(){
  try{
    const d=await api("list_review");
    render(d.posts||[]);
    log("Загружено: "+(d.posts||[]).length);
  }catch(e){log(e.message)}
}

async function approve(postId){
  try{
    const d=await api("list_review");
    const p=(d.posts||[]).find(x=>x.id===postId);
    const tg=(p?.smm_post_variants||[]).find(v=>v.network==="telegram");
    if(!tg)throw new Error("Telegram-вариант не найден");
    await api("publish_telegram",{variant_id:tg.id});
    log("Пост опубликован в Telegram.");
    await loadReview();
  }catch(e){log(e.message)}
}

async function publish(id){
  try{
    await api("publish_telegram",{variant_id:id});
    log("Опубликовано в Telegram.");
    await loadReview();
  }catch(e){log(e.message)}
}

function render(posts){
  renderScheduled(posts);
  const el=document.getElementById("posts");
  if(!posts.length){
    el.innerHTML='<div class="muted" style="margin-top:10px">Пока нет черновиков.</div>';
    return;
  }
  el.innerHTML=posts.map(p=>{
    const tg=(p.smm_post_variants||[]).find(v=>v.network==="telegram");
    return '<div class="post"><h3>'+esc(p.topic)+'</h3><div class="status">'+esc(p.status)+'</div><div class="variant">'+esc(tg?.text||"Telegram-вариант пока отсутствует")+'</div><div class="actions">'+
      (p.status==="review"?'<button class="btn purple" onclick="approve(\''+p.id+'\')">✓ Одобрить и опубликовать</button><button type="button" class="btn" onclick="schedule(\''+p.id+'\')">🕒 Запланировать</button>':"")+
      (p.status==="approved"&&tg?'<button class="btn primary" onclick="publish(\''+tg.id+'\')">🚀 Опубликовать в Telegram</button>':"")+
      (["draft","review"].includes(p.status)?'<button type="button" class="btn delete-draft" onclick="deletePost(\''+p.id+'\')">🗑 Удалить черновик</button>':"")+
      (p.status==="published"?'<button type="button" class="btn delete-draft" onclick="deletePost(\''+p.id+'\')">🗑 Удалить публикацию</button>':"")+
      '</div></div>';
  }).join("");
}

async function deletePost(postId){
  if(!confirm("Убрать эту публикацию из черновиков?"))return;
  try{await api("delete_post",{post_id:postId});log("Публикация удалена.");await loadReview()}catch(e){log(e.message)}
}

function schedule(postId){
  const modal=document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit";
  modal.innerHTML='<div style="width:min(420px,100%);background:#17171c;border:1px solid #383842;border-radius:20px;padding:20px;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><b style="font-size:18px">🕒 Запланировать публикацию</b><button type="button" id="scClose" style="background:#292930;color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:24px">×</button></div><label style="display:block;color:#aaa;font-size:13px;margin-bottom:7px">Дата и время публикации</label><input id="scDateTime" type="datetime-local" style="width:100%;box-sizing:border-box;height:52px;border-radius:12px;border:1px solid #3b3b45;background:#22222a;color:#fff;padding:0 12px;font-size:16px"><div id="scPreview" style="text-align:center;background:#22222a;border-radius:12px;padding:12px;margin:16px 0;color:#ddd"></div><button type="button" id="scSave" class="btn primary" style="width:100%;min-height:52px">✓ Запланировать</button></div>';
  document.body.appendChild(modal);

  const input=modal.querySelector("#scDateTime");
  const preview=modal.querySelector("#scPreview");
  const save=modal.querySelector("#scSave");
  const close=modal.querySelector("#scClose");

  const min=new Date(Date.now()+5*60000);
  min.setSeconds(0,0);
  min.setMinutes(Math.ceil(min.getMinutes()/5)*5);

  const pad=n=>String(n).padStart(2,"0");
  const localValue=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
  input.min=localValue(min);
  input.value=localValue(min);

  function updatePreview(){
    if(!input.value){preview.textContent="Выбери дату и время";return}
    const dt=new Date(input.value);
    preview.textContent=isNaN(dt)?"Неверная дата":dt.toLocaleString("ru-RU",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }

  input.addEventListener("input",updatePreview);
  close.addEventListener("click",()=>modal.remove());
  modal.addEventListener("click",e=>{if(e.target===modal)modal.remove()});
  updatePreview();

  save.addEventListener("click",async()=>{
    save.disabled=true;
    save.textContent="⏳ Сохраняю...";
    try{
      if(!input.value)throw new Error("Выбери дату и время.");
      const dt=new Date(input.value);
      if(isNaN(dt)||dt.getTime()<=Date.now()+5*60000){
        throw new Error("Выбери будущее время минимум через 5 минут.");
      }
      await api("schedule_post",{post_id:postId,publish_at:dt.toISOString()});
      modal.remove();
      log("Публикация запланирована на "+dt.toLocaleString("ru-RU"));
      await loadReview();
    }catch(e){
      save.disabled=false;
      save.textContent="✓ Запланировать";
      log("Ошибка планирования: "+e.message);
    }
  });
}
function renderScheduled(posts){
  const el=document.getElementById("scheduled");
  const q=(posts||[]).filter(p=>p.status==="scheduled").sort((a,b)=>new Date(a.publish_at)-new Date(b.publish_at));
  if(!q.length){el.innerHTML="";return}
  el.innerHTML='<div style="margin-top:14px"><h3 style="margin:0 0 8px">🕒 Запланировано на сервере</h3>'+
    q.map(x=>'<div class="post"><div>'+esc(x.topic)+'</div><div class="small">Публикация: <b>'+new Date(x.publish_at).toLocaleString("ru-RU")+'</b></div><button type="button" class="btn delete-draft" style="margin-top:9px" onclick="unschedulePost(\''+x.id+'\')">🗑 Удалить из запланированных</button></div>').join("")+
    '</div>';
}

function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

document.addEventListener("DOMContentLoaded",()=>{
  const media=document.getElementById("media"),preview=document.getElementById("mediaPreview"),thumb=document.getElementById("mediaThumb"),name=document.getElementById("mediaName"),remove=document.getElementById("mediaRemove");
  if(media)media.addEventListener("change",()=>{
    const f=media.files&&media.files[0];if(!f)return;
    name.textContent="📷 "+f.name;thumb.src=URL.createObjectURL(f);preview.style.display="block";
  });
  if(remove)remove.addEventListener("click",()=>{
    media.value="";preview.style.display="none";thumb.removeAttribute("src");name.textContent="";
  });
  loadReview();
});
</script></body></html>
