function connectionsView(){return '<section class="card"><h2>Подключение платформ</h2><p class="muted">Состояние зависит от реальных ключей, разрешений и API. Не вводи пароли от соцсетей в это приложение.</p><div class="platforms"><div class="platform"><div class="platform-top"><div class="platform-icon">ⓥ</div><span class="pill warning">Нужна настройка</span></div><h3>ВКонтакте</h3><p>Для статистики и публикаций нужно подключить VK API, права сообщества и безопасное хранение токена на сервере.</p><a href="https://dev.vk.com/" target="_blank" rel="noopener">Документация VK API ↗</a></div><div class="platform"><div class="platform-top"><div class="platform-icon">➤</div><span class="pill">Бот API</span></div><h3>Telegram</h3><p>Черновики и публикация поддерживаются серверным агентом при настроенном боте и правах администратора канала.</p><button class="btn" onclick="loadServerDrafts()">Проверить черновики</button></div><div class="platform"><div class="platform-top"><div class="platform-icon">◎</div><span class="pill neutral">Metricool</span></div><h3>Instagram</h3><p>Аналитика доступна через Metricool, если серверные секреты настроены. Публикация требует отдельной проверки разрешений.</p><button class="btn" onclick="navigate(\'analytics\')">Проверить аналитику</button></div></div></section><section class="card" style="margin-top:15px"><h2>Что нужно для полноценной работы</h2><div class="quick-list"><div class="quick-item"><div class="quick-icon">✓</div><div><b>AI-генерация</b><span>Использует существующий серверный AI endpoint.</span></div></div><div class="quick-item"><div class="quick-icon">↗</div><div><b>Статистика</b><span>Metricool для доступных Instagram-метрик; VK и Telegram требуют отдельных подключений.</span></div></div><div class="quick-item"><div class="quick-icon">▣</div><div><b>Публикация</b><span>Telegram поддерживается существующим агентом; VK и Instagram нужно подключить и протестировать отдельно.</span></div></div><div class="quick-item"><div class="quick-icon">🔒</div><div><b>Безопасность</b><span>Токены соцсетей должны храниться в серверных секретах, не в браузере.</span></div></div></div></section>'}
function renderChatMessages(){const el=document.getElementById("chatMessages");if(!el)return;if(!state.chat.length){el.innerHTML='<div class="bubble ai">Привет! Я AI-маркетолог Ramzes Tattoo. Помогу создавать контент, строить стратегию, разбирать реальные метрики и анализировать конкурентов. Что делаем первым?</div>';return}el.innerHTML=state.chat.map(m=>'<div class="bubble '+(m.role==="user"?"user":"ai")+'">'+esc(m.content)+'</div>').join("");el.scrollTop=el.scrollHeight}
async function sendChat(text){const prompt=String(text||"").trim();if(!prompt||state.busy)return;state.chat.push({role:"user",content:prompt});renderChatMessages();state.busy=true;const input=document.getElementById("chatInput"),send=document.getElementById("chatSend");if(input)input.value="";if(send){send.disabled=true;send.textContent="Думаю…"}try{const messages=state.chat.slice(-10).map(m=>({role:m.role,content:m.content}));const r=await fetch(SUPABASE_URL+"/functions/v1/smm-ai-chat",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({messages:messages})});let d={};try{d=await r.json()}catch(e){}if(!r.ok||d.error)throw Error(d.error||("AI HTTP "+r.status));state.chat.push({role:"assistant",content:d.answer||"Нет ответа"});renderChatMessages()}catch(e){state.chat.push({role:"assistant",content:"Не удалось получить ответ от AI: "+e.message});renderChatMessages()}finally{state.busy=false;if(send){send.disabled=false;send.textContent="Отправить"}}}
function askQuick(t){if(state.view!=="assistant")setView("assistant");sendChat(t)}
async function generateContent(){const topic=document.getElementById("contentTopic").value.trim();if(!topic){toast("Сначала укажи тему публикации");return}const platform=document.getElementById("contentPlatform").value,format=document.getElementById("contentFormat").value,goal=document.getElementById("contentGoal").value,notes=document.getElementById("contentNotes").value.trim(),img=document.getElementById("contentImage").files[0];state.platform=platform;state.format=format;state.generatedTopic=topic;const out=document.getElementById("contentOutput"),btn=document.getElementById("generateBtn");btn.disabled=true;btn.textContent="AI создаёт…";out.textContent="Подготавливаю текст, хук, CTA, визуальный план и рекомендации по съёмке…";try{const p="Ты маркетолог и редактор Ramzes Tattoo, тату-мастер в Новосибирске. Стиль бренда: графика, реализм, black & grey, чёрно-белые тату. Цель — качественные заявки и записи. Создай контент на русском языке. ТЕМА: "+topic+". ПЛОЩАДКА: "+platform+". ФОРМАТ: "+format+". ЦЕЛЬ: "+goal+". ДОПОЛНИТЕЛЬНО: "+(notes||"нет")+". Дай: 1) хук/заголовок; 2) готовый текст или сценарий с таймингом для видео/каждой Stories; 3) CTA на обращение/запись; 4) идею визуала; 5) точный промпт изображения на русском или английском, если нужна генерация; 6) список реальных кадров/фотографий, которые мастер должен загрузить сам; 7) адаптацию под указанную площадку. Для Reels распиши кадры по секундам, экранный текст и звук. Для Stories создай последовательность экранов. Не выдумывай результаты, отзывы, цены, статистику и свободные даты. Отмечай, где нужна реальная фотография мастера/работы.";const ans=await ai(p);state.generated=ans;out.textContent=ans;toast("Контент готов. Проверь перед публикацией")}catch(e){out.textContent="Ошибка AI: "+e.message;toast("Не удалось создать контент")}finally{btn.disabled=false;btn.textContent="✦ Создать с AI"}}
async function makeImagePrompt(){const topic=document.getElementById("contentTopic").value.trim();if(!topic){toast("Укажи тему изображения");return}const out=document.getElementById("contentOutput");out.textContent="Готовлю промпт для визуала…";try{const p="Создай подробный production-ready промпт для изображения для тату-мастера Ramzes Tattoo, Новосибирск. Тема: "+topic+". Формат: "+document.getElementById("contentFormat").value+". Площадка: "+document.getElementById("contentPlatform").value+". Цель: "+document.getElementById("contentGoal").value+". Включи композицию, свет, фон, цвет, типографику если уместна, соотношение сторон, негативный промпт, что нельзя и какие реальные фото мастера/работы необходимо загрузить как reference. Не изображай выдуманную татуировку как реальную работу мастера. Ответ на русском.";state.generated=await ai(p);state.generatedTopic=topic;out.textContent=state.generated;toast("Промпт готов")}catch(e){out.textContent="Ошибка: "+e.message}}
function copyGenerated(){if(!state.generated){toast("Сначала создай материал");return}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(state.generated).then(()=>toast("Скопировано")).catch(()=>fallbackCopy(state.generated));else fallbackCopy(state.generated)}
function fallbackCopy(t){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove();toast("Скопировано")}
function saveDraft(){if(!state.generated){toast("Сначала создай материал");return}const d={id:Date.now(),topic:state.generatedTopic||"Без названия",platform:document.getElementById("contentPlatform")?.value||state.platform,format:document.getElementById("contentFormat")?.value||state.format,text:state.generated,created_at:new Date().toISOString()};state.drafts.unshift(d);saveJson("ramzes_drafts",state.drafts);toast("Сохранено в черновики");}
function addToCalendar(){if(!state.generated){toast("Сначала создай материал");return}const d={id:Date.now(),topic:state.generatedTopic||"Публикация",platform:document.getElementById("contentPlatform")?.value||state.platform,format:document.getElementById("contentFormat")?.value||state.format,text:state.generated,date:new Date(Date.now()+86400000).toISOString().slice(0,10),status:"Идея"};state.calendar.push(d);saveJson("ramzes_calendar",state.calendar);toast("Добавлено в контент-план")}
function onImageSelected(e){const f=e.target.files&&e.target.files[0];if(!f)return;state.imageUrl=URL.createObjectURL(f);renderImagePreview();toast("Фото добавлено. Используй его как референс для анализа в AI-чате.")}
function renderImagePreview(){const el=document.getElementById("imagePreview");if(!el)return;const f=document.getElementById("contentImage")?.files?.[0];if(!f){el.style.display="none";return}el.style.display="block";el.innerHTML='<img src="'+state.imageUrl+'" alt="Предпросмотр изображения"><div class="small muted" style="margin-top:6px">'+esc(f.name)+' · '+Math.round(f.size/1024)+' КБ</div><button class="btn" style="margin-top:8px" onclick="clearImage()">Удалить фото</button>'}
function clearImage(){const i=document.getElementById("contentImage");if(i)i.value="";state.imageUrl="";renderImagePreview()}
function addCompetitor(){const name=document.getElementById("competitorName").value.trim(),url=document.getElementById("competitorUrl").value.trim(),notes=document.getElementById("competitorNotes").value.trim();if(!name||!url){toast("Добавь название и ссылку");return}state.competitors.push({id:Date.now(),name,url,notes});saveJson("ramzes_competitors",state.competitors);renderCompetitorList();document.getElementById("competitorName").value="";document.getElementById("competitorUrl").value="";document.getElementById("competitorNotes").value="";toast("Конкурент сохранён")}
function renderCompetitorList(){const el=document.getElementById("competitorList");if(!el)return;if(!state.competitors.length){el.innerHTML='<div class="empty">Пока никого нет. Добавь публичные страницы для сравнения.</div>';return}el.innerHTML=state.competitors.map(c=>'<div class="draft"><div class="draft-head"><div><h3>'+esc(c.name)+'</h3><a href="'+esc(c.url)+'" target="_blank" rel="noopener" class="small">Открыть страницу ↗</a></div><button class="btn danger" onclick="removeCompetitor('+c.id+')">Удалить</button></div>'+(c.notes?'<p class="small muted">'+esc(c.notes)+'</p>':"")+'</div>').join("")}
function removeCompetitor(id){state.competitors=state.competitors.filter(c=>c.id!==id);saveJson("ramzes_competitors",state.competitors);renderCompetitorList()}
async function analyzeCompetitors(){const out=document.getElementById("competitorAnalysis");if(!state.competitors.length){toast("Сначала добавь хотя бы одного конкурента");return}out.textContent="AI готовит сравнительный разбор…";try{const p="Ты аналитик маркетинга для Ramzes Tattoo в Новосибирске. Проанализируй конкурентную среду по данным, которые переданы ниже. Не утверждай, что открывал страницы или видел публикации, если их содержание не приведено. Отдели подтверждённые наблюдения от гипотез и недостающих данных. Цель исследования: "+document.getElementById("competitorGoal").value+". Данные конкурентов: "+JSON.stringify(state.competitors)+". Дай таблицу/список: позиционирование, офферы, контент-форматы, визуальная подача, сильные стороны, возможные пробелы, идеи отстройки Ramzes Tattoo и план проверок на 7 дней. Не выдумывай числа и не копируй чужие работы.";out.textContent=await ai(p)}catch(e){out.textContent="Ошибка AI: "+e.message}}
async function loadAnalytics(){const status=document.getElementById("analyticsStatus"),btn=document.getElementById("loadAnalyticsBtn");if(btn){btn.disabled=true;btn.textContent="Запрашиваю…"}status.textContent="Запрашиваю реальные метрики у серверной интеграции Metricool…";try{const r=await fetch(SUPABASE_URL+"/functions/v1/social-data",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({days:14})});let d={};try{d=await r.json()}catch(e){}if(!r.ok||!d.connected)throw Error(d.error||d.details||("HTTP "+r.status));state.analytics=d;state.analyticsError="";status.innerHTML='<span class="pill"><span class="dot"></span> Подключено</span> Источник: '+esc(d.source||"Metricool")+'. Период: '+esc((d.from||"").slice(0,10))+' — '+esc((d.to||"").slice(0,10));renderAnalyticsResult();document.getElementById("analyticsRaw").textContent=JSON.stringify(d.data,null,2);toast("Статистика получена")}catch(e){state.analyticsError=e.message;status.innerHTML='<span class="pill warning">Не удалось подключиться</span><br>'+esc(e.message)+'<br><span class="small">Проверь серверные секреты METRICOOL_API_TOKEN, METRICOOL_USER_ID, METRICOOL_BLOG_ID и доступ к профилю.</span>';document.getElementById("analyticsRaw").textContent="Нет данных: "+e.message;toast("Аналитика пока недоступна")}finally{if(btn){btn.disabled=false;btn.textContent="↻ Загрузить данные"}}}
function renderAnalyticsResult(){const el=document.getElementById("analyticsRaw");if(el&&state.analytics)el.textContent=JSON.stringify(state.analytics.data,null,2)}
async function analyzeAnalytics(){const out=document.getElementById("analyticsAI");if(!state.analytics){out.textContent="Сначала запроси статистику.";return}out.textContent="AI разбирает метрики…";try{out.textContent=await ai("Ты аналитик SMM для тату-мастера Ramzes Tattoo в Новосибирске. Разбери реальные данные, полученные от Metricool за 14 дней. Данные JSON: "+JSON.stringify(state.analytics.data).slice(0,7000)+". Укажи только выводы, которые поддерживаются данными. Если непонятно название поля — обозначь неопределённость. Сформируй: 1) краткий итог; 2) сильные сигналы; 3) что не работает или неизвестно; 4) три теста контента; 5) план на следующую неделю; 6) какие данные дополнительно собирать по обращениям и записям. Не обещай рост и не придумывай числа.")}catch(e){out.textContent="Ошибка AI: "+e.message}}
function renderCalendarItems(){const el=document.getElementById("calendarItems");if(!el)return;if(!state.calendar.length){el.innerHTML='<div class="empty">План пуст. Создай идею в контент-студии или сгенерируй план на неделю.</div>';return}el.innerHTML=state.calendar.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(c=>'<div class="draft"><div class="draft-head"><div><h3>'+esc(c.topic)+'</h3><div class="small muted">'+esc(c.date||"Дата не выбрана")+' · '+esc(c.platform||"")+' · '+esc(c.format||"")+'</div></div><button class="btn danger" onclick="removeCalendar('+c.id+')">Убрать</button></div><p class="draft-text">'+esc((c.text||"").slice(0,360))+(c.text&&c.text.length>360?"…":"")+'</p><div class="draft-actions"><button class="btn" onclick="copyCalendarText('+c.id+')">Копировать</button><button class="btn" onclick="editCalendar('+c.id+')">Открыть в студии</button></div></div>').join("")}
function removeCalendar(id){state.calendar=state.calendar.filter(x=>x.id!==id);saveJson("ramzes_calendar",state.calendar);renderCalendarItems()}
function editCalendar(id){const c=state.calendar.find(x=>x.id===id);if(!c)return;state.generated=c.text;state.generatedTopic=c.topic;setView("studio");setTimeout(()=>{document.getElementById("contentTopic").value=c.topic;document.getElementById("contentOutput").textContent=c.text;document.getElementById("contentPlatform").value=c.platform||"VK";document.getElementById("contentFormat").value=c.format||"Пост"},0)}
async function createWeekPlan(){const el=document.getElementById("calendarItems");el.innerHTML='<div class="empty">AI составляет план на неделю…</div>';try{const a=await ai("Составь недельный контент-план для Ramzes Tattoo, тату-мастера из Новосибирска, специализация графика, реализм, black & grey. На 7 дней, адаптируй VK, Telegram, Instagram. Для каждого дня: цель, формат, тема/хук, какие свои фото или видео снять, CTA, метрика. Балансируй личный бренд, экспертность, доверие, портфолио и продажи. Не придумывай статистику, отзывы, цены или доступные даты. Верни структурированный список.");state.generated=a;state.generatedTopic="Контент-план на 7 дней";const d={id:Date.now(),topic:"AI-план на 7 дней",platform:"Все площадки",format:"Контент-план",text:a,date:new Date().toISOString().slice(0,10),status:"План"};state.calendar.push(d);saveJson("ramzes_calendar",state.calendar);renderCalendarItems();toast("План добавлен")}catch(e){el.textContent="Ошибка AI: "+e.message}}
function renderDrafts(){const el=document.getElementById("draftList");if(!el)return;if(!state.drafts.length){el.innerHTML='<div class="empty">Пока нет черновиков. Создай материал в контент-студии.</div>';return}el.innerHTML=state.drafts.map(d=>'<div class="draft"><div class="draft-head"><div><h3>'+esc(d.topic)+'</h3><div class="small muted">'+esc(d.platform)+' · '+esc(d.format)+' · '+new Date(d.created_at).toLocaleString("ru-RU")+'</div></div><button class="btn danger" onclick="deleteDraft('+d.id+')">Удалить</button></div><p class="draft-text">'+esc(d.text.slice(0,600))+(d.text.length>600?"…":"")+'</p><div class="draft-actions"><button class="btn" onclick="copyDraftText('+d.id+')">Копировать</button><button class="btn primary" onclick="useDraft('+d.id+')">Редактировать</button><button class="btn purple" onclick="draftToCalendar('+d.id+')">В контент-план</button></div></div>').join("")}
function deleteDraft(id){state.drafts=state.drafts.filter(d=>d.id!==id);saveJson("ramzes_drafts",state.drafts);renderDrafts()}
function useDraft(id){const d=state.drafts.find(x=>x.id===id);if(!d)return;state.generated=d.text;state.generatedTopic=d.topic;setView("studio");setTimeout(()=>{document.getElementById("contentTopic").value=d.topic;document.getElementById("contentOutput").textContent=d.text;document.getElementById("contentPlatform").value=d.platform||"VK";document.getElementById("contentFormat").value=d.format||"Пост"},0)}
function draftToCalendar(id){const d=state.drafts.find(x=>x.id===id);if(!d)return;state.calendar.push({id:Date.now(),topic:d.topic,platform:d.platform,format:d.format,text:d.text,date:new Date(Date.now()+86400000).toISOString().slice(0,10),status:"Идея"});saveJson("ramzes_calendar",state.calendar);toast("Добавлено в контент-план")}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("Скопировано")).catch(()=>fallbackCopy(t));else fallbackCopy(t)}
function copyDraftText(id){const d=state.drafts.find(x=>x.id===id);if(d)copyText(d.text)}
function copyCalendarText(id){const d=state.calendar.find(x=>x.id===id);if(d)copyText(d?.text||"")}
async function loadServerDrafts(){const el=document.getElementById("serverDrafts");if(el)el.innerHTML='<div class="empty">Загружаю черновики…</div>';try{const d=await api("list_review",{});const posts=d.posts||[];if(!el)return;if(!posts.length){el.innerHTML='<div class="empty">На сервере пока нет публикаций для согласования.</div>';return}el.innerHTML=posts.map(p=>{const vars=p.smm_post_variants||[];const tg=vars.find(v=>v.network==="telegram");return '<div class="draft"><div class="draft-head"><div><h3>'+esc(p.topic)+'</h3><div class="small muted">Статус: '+esc(p.status)+'</div></div><span class="pill neutral">Сервер</span></div><p class="draft-text">'+esc(tg?.text||"Текст не найден")+'</p><div class="draft-actions">'+(p.status==="review"&&tg?'<button class="btn primary" onclick="publishServer(\''+tg.id+'\')">Опубликовать в Telegram</button>':"")+'</div></div>'}).join("")}catch(e){if(el)el.innerHTML='<div class="notice">Не удалось получить серверные черновики: '+esc(e.message)+'</div>'}}
async function publishServer(id){if(!confirm("Опубликовать этот материал в Telegram?"))return;try{await api("publish_telegram",{variant_id:id});toast("Запрос на публикацию выполнен");loadServerDrafts()}catch(e){toast("Ошибка публикации: "+e.message)}}
function refreshAll(){if(state.view==="analytics")loadAnalytics();else if(state.view==="library"){renderDrafts();loadServerDrafts()}else{renderView();toast("Данные интерфейса обновлены")}}
function renderAll(){renderView();if(state.view==="library")renderDrafts();if(state.view==="competitors")renderCompetitorList()}
document.addEventListener("submit",e=>{if(e.target.id==="chatForm"){e.preventDefault();sendChat(document.getElementById("chatInput").value)}});
function init(){renderView();if(state.view==="library")renderDrafts();if(state.view==="competitors")renderCompetitorList()}
init();
</script>
</body></html>
