<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b10"><title>Ramzes Tattoo — SMM Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#f4f4f5;font-family:Inter,system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:21px;font-weight:800}.sub{color:#9ca3af;font-size:12px;margin-top:3px}.dot{width:10px;height:10px;border-radius:50%;background:#a3e635;box-shadow:0 0 14px #a3e635}.card{background:#121219;border:1px solid #24242d;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.net{padding:13px 8px;border-radius:14px;background:#191922;text-align:center}.net b{display:block;font-size:14px}.net span{font-size:11px;color:#a1a1aa}.label{font-size:12px;color:#a1a1aa;margin-bottom:7px}textarea,input{width:100%;background:#0d0d13;color:#fff;border:1px solid #30303a;border-radius:12px;padding:12px;outline:0}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.btn{padding:12px 15px;border-radius:12px;background:#24242d;color:#fff;font-weight:700}.primary{background:#a3e635;color:#101014}.purple{background:#8b5cf6}.muted{color:#a1a1aa}.post{border:1px solid #2b2b35;border-radius:14px;padding:13px;margin-top:10px}.post h3{margin:0 0 8px;font-size:15px}.status{font-size:11px;color:#a3e635}.variant{background:#0d0d13;border-radius:12px;padding:11px;margin-top:8px;white-space:pre-wrap;font-size:13px;line-height:1.45}.actions{display:flex;gap:7px;margin-top:9px}.actions .btn{flex:1}.log{font-size:12px;white-space:pre-wrap;color:#b8b8c2;max-height:180px;overflow:auto}.small{font-size:11px;color:#71717a}.settings input{margin-bottom:8px}
</style></head>
<body><main class="wrap">
<header class="head"><div><div class="brand">Ramzes Tattoo · SMM Agent</div><div class="sub">Telegram · VK · Instagram</div></div><div class="dot"></div></header>
<section class="card"><div class="grid"><div class="net"><b>Telegram</b><span>готов</span></div><div class="net"><b>VK</b><span>подключение</span></div><div class="net"><b>Instagram</b><span>Metricool</span></div></div></section>
<section class="card"><div class="label">Тема публикации</div><textarea id="topic" placeholder="Например: свободная дата на татуировку на этой неделе"></textarea><div class="row"><button class="btn primary" onclick="createDraft()">Создать черновик</button><button class="btn" onclick="loadReview()">Обновить</button></div></section>
<section class="card"><h3 style="margin:0">На согласовании</h3><div id="posts"><div class="muted" style="margin-top:10px">Нажми «Обновить»</div></div></section>
<section class="card settings"><details><summary>⚙️ Подключение панели</summary><p class="small">Нужен только публичный Supabase anon key. Service role key и токен Telegram сюда не вводить.</p><input id="url" value="https://jgzzdsittnzomedvsspj.supabase.co" placeholder="Supabase URL"><input id="key" type="password" placeholder="Supabase anon key"><button class="btn" onclick="saveCfg()">Сохранить</button></details></section>
<section class="card"><div class="label">Лог</div><div id="log" class="log">Готов.</div></section>
</main>
<script>
const BRAND="114e1c88-4850-41df-b192-1aa00b1782f1";
const saved=JSON.parse(localStorage.getItem("ramzes_smm_cfg")||"{}");
if(saved.url)document.getElementById("url").value=saved.url;if(saved.key)document.getElementById("key").value=saved.key;
function cfg(){return {url:document.getElementById("url").value.replace(/\/$/,""),key:document.getElementById("key").value}}
function saveCfg(){localStorage.setItem("ramzes_smm_cfg",JSON.stringify(cfg()));log("Настройки сохранены.");loadReview()}
function log(x){document.getElementById("log").textContent=new Date().toLocaleTimeString()+" — "+x}
async function api(command,extra={}){const c=cfg();if(!c.key)throw new Error("Добавь Supabase anon key в настройках");const r=await fetch(c.url+"/functions/v1/smm-agent",{method:"POST",headers:{"Content-Type":"application/json","apikey":c.key,"Authorization":"Bearer "+c.key},body:JSON.stringify({command,brand_id:BRAND,...extra})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||"Ошибка API");return d}
async function createDraft(){try{const topic=document.getElementById("topic").value.trim();const d=await api("create_draft",{topic});log("Черновик создан: "+d.post.id);document.getElementById("topic").value="";loadReview()}catch(e){log(e.message)}}
async function loadReview(){try{const d=await api("list_review");render(d.posts||[]);log("Загружено: "+(d.posts||[]).length)}catch(e){log(e.message)}}
async function approve(variantId){try{await api("publish_telegram",{variant_id:variantId});log("Пост одобрен и опубликован в Telegram.");loadReview()}catch(e){log(e.message)}}
async function publish(id){try{await api("publish_telegram",{variant_id:id});log("Опубликовано в Telegram.");loadReview()}catch(e){log(e.message)}}
function render(posts){const el=document.getElementById("posts");if(!posts.length){el.innerHTML='<div class="muted" style="margin-top:10px">Пока нет черновиков.</div>';return}el.innerHTML=posts.map(p=>{const tg=(p.smm_post_variants||[]).find(v=>v.network==="telegram");return '<div class="post"><h3>'+esc(p.topic)+'</h3><div class="status">'+esc(p.status)+'</div><div class="variant">'+esc(tg?.text||"Telegram-вариант пока отсутствует")+'</div><div class="actions">'+(p.status==="review"?'<button class="btn purple" onclick="approve(\''+p.id+'\')">✓ Одобрить и опубликовать</button>':"")+(p.status==="approved"&&tg?'<button class="btn primary" onclick="publish(\''+tg.id+'\')">🚀 Опубликовать в Telegram</button>':"")+'</div></div>'}).join("")}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
</script></body></html>
